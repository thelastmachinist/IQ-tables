<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>IQ Tables</title>
<meta name="description" content="Browse, draft and inscribe databases on IQ Labs' on-chain tables.">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #14171c; --muted: #5d6572; --line: #e2e5ea; --soft: #eef1f5;

  --good: #1f7a4d; --good-soft: #e3f4ea; --warn: #9a5b00; --warn-soft: #fff3dc; --bad: #b3261e; --bad-soft: #fde8e6;
  --ghost: #7a4fd0; --ghost-soft: #f1ebfd;

  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2a3039; --soft: #1e232b;
    --accent: #7d97ff; --accent-ink: #0f1216; --accent-soft: #212a45;
    --good: #5fd39a; --good-soft: #15291f; --warn: #f0b458; --warn-soft: #2d2413; --bad: #ff8a80; --bad-soft: #2f1817;
    --ghost: #b69bff; --ghost-soft: #231c38;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2a3039; --soft: #1e232b;
  --accent: #7d97ff; --accent-ink: #0f1216; --accent-soft: #212a45;
  --good: #5fd39a; --good-soft: #15291f; --warn: #f0b458; --warn-soft: #2d2413; --bad: #ff8a80; --bad-soft: #2f1817;
  --ghost: #b69bff; --ghost-soft: #231c38;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }

.small { font-size: .85rem; } .muted { color: var(--muted); } .center { text-align: center; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.big { font-size: 1.25rem; font-weight: 600; }
header.top { position: sticky; top: 0; z-index: 5; display: flex; gap: 14px; align-items: center; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }

  linear-gradient(var(--panel),var(--panel)) 6px 0/2px 100% no-repeat,

  linear-gradient(var(--panel),var(--panel)) 0 6px/100% 2px no-repeat,
  linear-gradient(var(--panel),var(--panel)) 0 13px/100% 2px no-repeat, var(--accent); }

.btn:hover { background: var(--soft); }

pre.wrap { white-space: pre-wrap; word-break: break-word; }
.drop { display: grid; gap: 6px; place-items: center; text-align: center; border: 2px dashed var(--line); border-radius: var(--radius); padding: 28px 16px; cursor: pointer; background: var(--soft); margin: 6px 0 12px; }
.drop:hover { border-color: var(--accent); }
body.dropping::after { content: "Drop account or key files to log in"; position: fixed; inset: 12px; z-index: 30; border: 3px dashed var(--accent); border-radius: 16px; background: var(--accent-soft); opacity: .94; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 600; color: var(--accent); pointer-events: none; }

.link.file { text-align: left; }
.link.git { text-align: left; }

.cell-link { margin-top: 2px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nowrap { white-space: nowrap; }

.side-h { font-weight: 600; margin-bottom: 6px; } .side-h a { color: var(--ink); }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { padding-left: 14px; margin: 2px 0 6px; }
.tree a { display: inline-block; padding: 3px 6px; border-radius: 6px; color: var(--ink); max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
