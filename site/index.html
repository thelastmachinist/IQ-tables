<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IQ Tables</title>
<meta name="description" content="Browse, draft and inscribe databases on IQ Labs' on-chain tables.">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #14171c; --muted: #5d6572; --line: #e2e5ea; --soft: #eef1f5;
  --accent: #3a5bd9; --accent-ink: #ffffff; --accent-soft: #e7ecfc;
  --good: #1f7a4d; --good-soft: #e3f4ea; --warn: #9a5b00; --warn-soft: #fff3dc; --bad: #b3261e; --bad-soft: #fde8e6;
  --ghost: #7a4fd0; --ghost-soft: #f1ebfd;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2a3039; --soft: #1e232b;
    --accent: #7d97ff; --accent-ink: #0f1216; --accent-soft: #212a45;
    --good: #5fd39a; --good-soft: #15291f; --warn: #f0b458; --warn-soft: #2d2413; --bad: #ff8a80; --bad-soft: #2f1817;
    --ghost: #b69bff; --ghost-soft: #231c38;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2a3039; --soft: #1e232b;
  --accent: #7d97ff; --accent-ink: #0f1216; --accent-soft: #212a45;
  --good: #5fd39a; --good-soft: #15291f; --warn: #f0b458; --warn-soft: #2d2413; --bad: #ff8a80; --bad-soft: #2f1817;
  --ghost: #b69bff; --ghost-soft: #231c38;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.6rem; margin: .2rem 0 .6rem; letter-spacing: -.01em; }
h2 { font-size: 1.15rem; margin: 1.6rem 0 .6rem; }
h3 { font-size: 1rem; margin: 0 0 .6rem; }
code, .mono { font-family: var(--mono); font-size: .88em; }
.small { font-size: .85rem; } .muted { color: var(--muted); } .center { text-align: center; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.big { font-size: 1.25rem; font-weight: 600; }
header.top { position: sticky; top: 0; z-index: 5; display: flex; gap: 14px; align-items: center; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); font-size: 1.05rem; }
.brand:hover { text-decoration: none; }
.logo { width: 20px; height: 20px; border-radius: 5px; background:
  linear-gradient(var(--panel),var(--panel)) 6px 0/2px 100% no-repeat,
  linear-gradient(var(--panel),var(--panel)) 13px 0/2px 100% no-repeat,
  linear-gradient(var(--panel),var(--panel)) 0 6px/100% 2px no-repeat,
  linear-gradient(var(--panel),var(--panel)) 0 13px/100% 2px no-repeat, var(--accent); }
nav { display: flex; gap: 4px; }
nav a { padding: 6px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; }
nav a.on { background: var(--accent-soft); color: var(--accent); }
nav a:hover { text-decoration: none; color: var(--ink); }
.search { flex: 1; min-width: 160px; max-width: 420px; margin-left: auto; }
.wallet { position: relative; }
.menu { position: absolute; right: 0; top: 110%; width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
.menu img { vertical-align: middle; margin-right: 6px; border-radius: 4px; }
main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 40px; }
footer { max-width: 1180px; margin: 0 auto; padding: 18px 20px 40px; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { width: 100%; font-family: var(--mono); font-size: .85rem; }
.btn { font: inherit; font-weight: 500; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.big { padding: 10px 18px; font-size: 1rem; }
.btn.wide { width: 100%; justify-content: flex-start; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.ghostbtn { background: var(--soft); }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0 2px; }
.link.danger { color: var(--bad); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.on { background: var(--good); }
.hero p { color: var(--muted); max-width: 760px; margin-top: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin: 14px 0; }
.card.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cols2 > .card { margin: 0; }
@media (max-width: 860px) { .cols2 { grid-template-columns: 1fr; } }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.row input { flex: 1; min-width: 140px; }
.grow { flex: 1; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
.toolbar input[type=search] { min-width: 200px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 11px; font: inherit; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg .n { font-size: .8em; opacity: .75; }
.kv { display: grid; gap: 4px; margin: 6px 0 12px; }
.kv > div { display: grid; grid-template-columns: 160px 1fr; gap: 10px; }
.kv > div > span:first-child { color: var(--muted); font-size: .88rem; }
@media (max-width: 600px) { .kv > div { grid-template-columns: 1fr; gap: 0; } }
.crumbs { margin: 0; color: var(--muted); font-size: .9rem; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
table.grid { width: 100%; border-collapse: collapse; background: var(--panel); }
.scroll > table.grid { border: 0; }
body > #app table.grid:not(.data):not(.edit) { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
table.grid th, table.grid td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.grid th { font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: var(--soft); font-weight: 600; white-space: nowrap; }
table.grid td.num, table.grid th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data td { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.data tbody tr { cursor: pointer; }
table.data tbody tr:hover { background: var(--soft); }
table.data tr.sel { background: var(--accent-soft); }
table.data tr.unofficial td:first-child { box-shadow: inset 3px 0 var(--warn); }
table.data tr.detail { cursor: default; background: var(--soft); }
table.data tr.detail td { white-space: normal; max-width: none; }
pre { background: var(--soft); padding: 10px 12px; border-radius: 8px; overflow: auto; font-size: .82rem; max-height: 360px; margin: 6px 0; }
pre.secret { word-break: break-all; white-space: pre-wrap; border: 1px dashed var(--bad); }
.sort { background: none; border: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; padding: 0; }
table.edit input { width: 100%; min-width: 90px; padding: 4px 6px; border-radius: 6px; font-size: .9rem; }
table.edit td { padding: 4px 6px; }
table.edit tr.ghost td { background: var(--ghost-soft); }
table.edit tr.ghost input { border-style: dashed; border-color: var(--ghost); background: transparent; }
table.edit tr.tomb td { text-decoration: line-through; color: var(--muted); }
table.edit tr.inscribed td { color: var(--ink); }
.pill { display: inline-block; font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); vertical-align: middle; text-decoration: none; }
.pill.ghost { background: var(--ghost-soft); color: var(--ghost); border: 1px dashed var(--ghost); }
.pill.off { background: var(--good-soft); color: var(--good); }
.pill.un { background: var(--warn-soft); color: var(--warn); }
.pill.iqt { background: var(--accent-soft); color: var(--accent); }
.addr { font-family: var(--mono); font-size: .85em; }
.addrbox { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--soft); border-radius: 8px; padding: 8px 10px; }
.addrbox .mono { word-break: break-all; flex-basis: 100%; }
.qr { display: block; margin: 8px 0; border-radius: 6px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tabs button { font: inherit; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 11px; cursor: pointer; color: var(--muted); }
.tabs button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.tablehead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-top: 14px; }
.tablehead h3 { margin: 0; }
details { margin: 10px 0; }
summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.formgrid { display: grid; gap: 10px; }
.formgrid label { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
.check { display: flex !important; gap: 8px; align-items: center; color: var(--ink) !important; font-size: .9rem; }
.costs { padding-left: 18px; margin: 6px 0; }
.costs li { margin: 3px 0; }
.run { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
.bar { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.log { font-family: var(--mono); font-size: .78rem; padding-left: 18px; max-height: 220px; overflow: auto; }
.log li.warn { color: var(--warn); }
.steps { font-size: .85rem; padding-left: 18px; }
.toast { position: sticky; top: 58px; z-index: 4; max-width: 1140px; margin: 10px auto 0; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 10px 14px; border-radius: var(--radius); }
.toast.ok { background: var(--good-soft); color: var(--good); }
.toast.bad { background: var(--bad-soft); color: var(--bad); }
.x { background: none; border: 0; font-size: 1.2rem; color: inherit; cursor: pointer; line-height: 1; }
.loading { color: var(--muted); padding: 20px 0; }
.prose p { max-width: 780px; }
@media (max-width: 640px) {
  header.top { padding: 10px 16px; gap: 10px; }
  nav { order: 3; flex-basis: 100%; overflow-x: auto; }
  .wallet { margin-left: auto; }
  .menu { width: min(260px, calc(100vw - 32px)); }
  .search { order: 5; max-width: none; flex-basis: 100%; }
  main { padding: 16px; }
}
</style>
</head>

<script>
// IQ Tables — browser bridge.
// Browsers can only run WebAssembly through JavaScript, so this file gives the
// Rust app the few things it can't do itself: the DOM, fetch, localStorage,
// the clock/RNG, and the Solana wallet (via the Wallet Standard). No app logic.
(async () => {
  "use strict";
  const root = document.getElementById("app");
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  let w = null; // wasm exports
  let staged = null;
  let rendering = false;
  const queue = [];

  const mem = () => new Uint8Array(w.memory.buffer);
  const str = (p, l) => dec.decode(mem().subarray(p, p + l));
  const bytes = (p, l) => mem().slice(p, p + l);
  const put = (u8) => {
    const p = w.alloc(u8.length);
    mem().set(u8, p);
    return p;
  };
  const stage = (u8) => { staged = u8; return u8.length; };
  const done = (id, ok, status, data) => {
    const u8 = typeof data === "string" ? enc.encode(data) : data || new Uint8Array(0);
    const p = put(u8);
    w.on_async(id, ok ? 1 : 0, status, p, u8.length);
  };

  // ---- Wallet Standard discovery (Phantom, Solflare, Backpack, …)
  const wallets = [];
  let current = null; // { wallet, account }
  const api = {
    register(...ws) {
      for (const x of ws) if (!wallets.includes(x)) wallets.push(x);
      if (w) ev("wallets", "", "", "");
      return () => {};
    },
  };
  window.addEventListener("wallet-standard:register-wallet", (e) => { try { e.detail(api); } catch (_) {} });
  try { window.dispatchEvent(new CustomEvent("wallet-standard:app-ready", { detail: api })); } catch (_) {}
  const solana = () => wallets.filter((x) => (x.chains || []).some((c) => String(c).startsWith("solana:")) && x.features && x.features["standard:connect"]);
  const errText = (e) => String((e && (e.message || e.name)) || e || "error");

  // ---- rendering with focus/selection preserved across innerHTML swaps
  function render(html) {
    rendering = true;
    const a = document.activeElement;
    const id = a && a.id;
    let s0 = null, s1 = null;
    try { s0 = a.selectionStart; s1 = a.selectionEnd; } catch (_) {}
    const openDetails = [...root.querySelectorAll("details[open] > summary")].map((s) => s.textContent);
    root.innerHTML = html;
    for (const s of root.querySelectorAll("details > summary")) if (openDetails.includes(s.textContent)) s.parentElement.open = true;
    if (id) {
      const n = document.getElementById(id);
      if (n) {
        n.focus({ preventScroll: true });
        try { if (s0 !== null) n.setSelectionRange(s0, s1); } catch (_) {}
      }
    }
    rendering = false;
    while (queue.length) ev(...queue.shift());
  }

  const imports = {
    host: {
      log: (p, l) => console.log("[iq-tables]", str(p, l)),
      render: (p, l) => render(str(p, l)),
      fetch: (id, mp, ml, up, ul, bp, bl, cp, cl) => {
        const method = str(mp, ml), url = str(up, ul);
        const init = { method };
        if (bl) init.body = str(bp, bl);
        if (cl) init.headers = { "content-type": str(cp, cl) };
        fetch(url, init)
          .then(async (r) => done(id, true, r.status, await r.text()))
          .catch((e) => done(id, false, 0, errText(e)));
      },
      storage_get: (kp, kl) => {
        let v = null;
        try { v = localStorage.getItem(str(kp, kl)); } catch (_) {}
        return v === null ? -1 : stage(enc.encode(v));
      },
      take: (p) => { mem().set(staged, p); staged = null; },
      storage_set: (kp, kl, vp, vl) => { try { localStorage.setItem(str(kp, kl), str(vp, vl)); } catch (_) {} },
      now: () => Date.now(),
      random: (p, l) => crypto.getRandomValues(mem().subarray(p, p + l)),
      wallets: () => stage(enc.encode(JSON.stringify(solana().map((x) => ({ name: x.name, icon: x.icon || "" }))))),
      wallet_connect: (id, np, nl) => {
        const name = str(np, nl);
        const x = solana().find((y) => y.name === name);
        if (!x) return done(id, false, 0, "wallet not found");
        x.features["standard:connect"].connect()
          .then((r) => {
            const acct = (r && r.accounts && r.accounts[0]) || x.accounts[0];
            if (!acct) throw new Error("no account");
            current = { wallet: x, account: acct };
            done(id, true, 0, JSON.stringify({ name: x.name, address: acct.address }));
          })
          .catch((e) => done(id, false, 0, errText(e)));
      },
      wallet_disconnect: () => {
        try { current && current.wallet.features["standard:disconnect"] && current.wallet.features["standard:disconnect"].disconnect(); } catch (_) {}
        current = null;
      },
      wallet_sign_message: (id, mp, ml) => {
        const message = bytes(mp, ml);
        const f = current && current.wallet.features["solana:signMessage"];
        if (!f) return done(id, false, 0, "this wallet can't sign messages");
        f.signMessage({ account: current.account, message })
          .then((out) => done(id, true, 0, new Uint8Array(out[0].signature)))
          .catch((e) => done(id, false, 0, errText(e)));
      },
      wallet_sign_and_send: (id, tp, tl, cp, cl) => {
        const transaction = bytes(tp, tl), chain = str(cp, cl);
        const f = current && current.wallet.features["solana:signAndSendTransaction"];
        if (!f) return done(id, false, 0, "this wallet can't send transactions");
        f.signAndSendTransaction({ account: current.account, chain, transaction })
          .then((out) => done(id, true, 0, new Uint8Array(out[0].signature)))
          .catch((e) => done(id, false, 0, errText(e)));
      },
      download: (np, nl, mp, ml, dp, dl) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([bytes(dp, dl)], { type: str(mp, ml) }));
        a.download = str(np, nl);
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
      },
      copy: (p, l) => { try { navigator.clipboard.writeText(str(p, l)); } catch (_) {} },
      timer: (id, ms) => setTimeout(() => done(id, true, 0, ""), ms),
      set_hash: (p, l) => {
        const h = str(p, l);
        if (location.hash !== h) location.hash = h;
        else ev("route", "", "", h);
      },
    },
  };

  // ---- load the wasm (embedded for single-file builds, else fetched)
  let module;
  const embedded = document.getElementById("wasm-b64");
  if (embedded) {
    const bin = Uint8Array.from(atob(embedded.textContent.trim()), (c) => c.charCodeAt(0));
    module = await WebAssembly.instantiate(bin, imports);
  } else {
    module = await WebAssembly.instantiateStreaming(fetch("iq_tables.wasm"), imports);
  }
  w = module.instance.exports;

  function ev(kind, action, arg, value) {
    if (rendering) { queue.push([kind, action, arg, value]); return; }
    const parts = [kind, action, arg, value].map((s) => enc.encode(String(s == null ? "" : s)));
    const ps = parts.map(put);
    w.on_event(ps[0], parts[0].length, ps[1], parts[1].length, ps[2], parts[2].length, ps[3], parts[3].length);
  }

  // Typing in a field and then clicking a button fires "change" on
  // mousedown; re-rendering at that moment would swap the button out from
  // under the pointer and swallow the click. Hold changes until the click.
  let pointerDown = false;
  const held = [];
  const flush = () => { while (held.length) ev(...held.shift()); };
  document.addEventListener("pointerdown", () => { pointerDown = true; }, true);
  document.addEventListener("pointerup", () => { pointerDown = false; setTimeout(flush, 0); }, true);
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-a]");
    flush();
    if (!t || t.disabled) return;
    if (t.tagName === "TR" && e.target.closest("a,button,input,select,textarea,label")) return;
    e.preventDefault();
    ev("click", t.dataset.a, t.dataset.arg, t.dataset.val);
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (!t.dataset) return;
    if (t.dataset.in) {
      const args = ["change", t.dataset.in, t.dataset.arg, t.type === "checkbox" ? String(t.checked) : t.value];
      if (pointerDown && t.type !== "checkbox" && t.tagName !== "SELECT") held.push(args); else ev(...args);
    }
    if (t.dataset.file && t.files && t.files[0]) {
      const f = t.files[0];
      f.text().then((txt) => ev("file", t.dataset.file, t.dataset.arg, txt));
      t.value = "";
    }
  });
  let liveTimer = null;
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (!t.dataset || !t.dataset.live) return;
    clearTimeout(liveTimer);
    liveTimer = setTimeout(() => ev("input", t.dataset.live, t.dataset.arg, t.value), 140);
  });
  document.addEventListener("keydown", (e) => {
    const t = e.target;
    if (e.key !== "Enter" || !t.dataset) return;
    if (t.dataset.enter) {
      e.preventDefault();
      if (t.dataset.in) ev("change", t.dataset.in, t.dataset.arg, t.value);
      ev("enter", t.dataset.enter, t.dataset.arg, t.value);
    } else if (t.dataset.in && t.tagName === "INPUT") {
      e.preventDefault();
      t.blur();
    }
  });
  document.addEventListener("click", (e) => {
    // close the wallet menu when clicking elsewhere
    const m = document.querySelector(".menu");
    if (m && !e.target.closest(".wallet")) ev("click", "connect-menu", "", "");
  }, true);
  window.addEventListener("hashchange", () => ev("route", "", "", location.hash));

  w.start();
  ev("route", "", "", location.hash);
  // wallets that register a moment after load
  setTimeout(() => ev("wallets", "", "", ""), 600);
})().catch((e) => {
  document.getElementById("app").innerHTML =
    '<div class="card bad" style="margin:2rem">IQ Tables failed to start: ' +
    String(e && e.message || e).replace(/[<&]/g, "") + "</div>";
});
</script>
</body>
</html>
